<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompt Atölyesi: Etkinlik Alanı</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8f7;--card:#fff;--ink:#14232e;--mute:#5b6b76;--line:#d5dedb;--acc:#0b7a75;--accsoft:#dff1ee;--ok:#1b7f3b;--oksoft:#e0f4e6;--bad:#b3261e;--badsoft:#fbe4e2;--amb:#8a5a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a21;--card:#17262f;--ink:#e8f0ee;--mute:#9db0b8;--line:#2c4049;--acc:#4fd1c5;--accsoft:#14343a;--ok:#6fd58c;--oksoft:#15321f;--bad:#ff8a80;--badsoft:#3b1c1a;--amb:#f0c060}}
:root[data-theme="dark"]{--bg:#0f1a21;--card:#17262f;--ink:#e8f0ee;--mute:#9db0b8;--line:#2c4049;--acc:#4fd1c5;--accsoft:#14343a;--ok:#6fd58c;--oksoft:#15321f;--bad:#ff8a80;--badsoft:#3b1c1a;--amb:#f0c060}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;font-size:17px}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.15;margin:8px 0 6px;font-weight:800}
.sub{color:var(--mute);margin:0 0 20px}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;color:var(--mute);font:inherit;font-weight:600;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc)}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;margin-bottom:6px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 14px}
.box{background:var(--accsoft);border-radius:8px;padding:12px 14px;margin:0 0 14px;white-space:pre-wrap;font-size:.98rem}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--oksoft)}
.opt.no{border-color:var(--bad);background:var(--badsoft)}
.opt:disabled{cursor:default}
.fb{margin:6px 0 14px;padding:12px 14px;border-radius:8px;background:var(--accsoft)}
.btn{font:inherit;font-weight:600;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 20px;cursor:pointer}
:root[data-theme="dark"] .btn{color:#0f1a21}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0f1a21}}
.btn.alt{background:none;color:var(--acc);border:2px solid var(--acc)}
.big{font-size:3rem;font-weight:800;color:var(--acc);margin:0;line-height:1}
textarea{width:100%;min-height:170px;font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px;resize:vertical}
select{font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:8px;max-width:100%;margin-bottom:12px}
.chk{list-style:none;padding:0;margin:14px 0}
.chk li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk b{min-width:1.4em}
.chk .y b{color:var(--ok)}.chk .n b{color:var(--bad)}
.chk small{display:block;color:var(--mute)}
.note{color:var(--mute);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<h1>Prompt Atölyesi</h1>
<p class="sub">Kendini test et, promptunu yaz, anında geri bildirim al.</p>
<div class="tabs" role="tablist">
  <button role="tab" id="t1" aria-selected="true" aria-controls="p1">Bilgi testi</button>
  <button role="tab" id="t2" aria-selected="false" aria-controls="p2">Prompt doktoru</button>
</div>

<section id="p1" role="tabpanel" aria-labelledby="t1"></section>

<section id="p2" role="tabpanel" aria-labelledby="t2" hidden>
  <div class="card">
    <label for="sc"><b>Senaryo seç</b></label><br>
    <select id="sc"></select>
    <div class="box" id="scText"></div>
    <label for="pr"><b>Promptunu yaz</b></label>
    <textarea id="pr" placeholder="Yapay zekaya vereceğin talimatı buraya yaz…"></textarea>
    <p><button class="btn" id="chk">Promptumu kontrol et</button></p>
    <div id="res" aria-live="polite"></div>
    <p class="note">Bu araç, promptta yapı taşlarının izini kelimelerden arayan basit bir ön kontroldür. Kaliteyi asıl belirleyen, grupla birlikte yapacağınız tartışmadır.</p>
  </div>
</section>

</main>

<script>
const Q=[
{q:"Hangi görev tanımı en nettir?",o:["Bu toplantı notlarına bak.","Bu notlardan aksiyon maddelerini çıkar; her birinin yanına sorumlu kişiyi ve tarihi yaz.","Toplantı hakkında bir şeyler söyle."],a:1,e:"Somut bir eylem fiili ve beklenen çıktı var. “Bak” ve “bir şeyler söyle” modeli tahmine zorlar."},
{q:"Müşteri şikayetine cevap yazdıracaksın. Promptu en çok ne güçlendirir?",o:["Daha uzun bir giriş cümlesi","Durumu anlatmak: sipariş 10 gündür gelmedi, kargo gecikmeyi teyit etti, müşteri sadık","“Çok iyi bir cevap yaz” demek"],a:1,e:"Bağlam, yapay zekanın senin dünyanı anlamasını sağlar. Abartılı övgü cümleleri kaliteyi artırmaz."},
{q:"Üç paketin fiyatını karşılaştırtıyorsun ve sonucu toplantıda göstereceksin. Hangi ek talimat en yararlı?",o:["“Detaylı anlat.”","“Tablo yap: Paket, Fiyat, Kullanıcı sayısı, En uygun müşteri. Altına 2 cümlelik öneri ekle.”","“Güzel bir şekilde yaz.”"],a:1,e:"Çıktının biçimini tarif etmezsen model kendi tahminini yapar. Sonra düzenlemek zorunda kalırsın."},
{q:"Şirketinin marka sesini yakalamak istiyorsun. En etkili yöntem hangisi?",o:["Sesi 100 kelimeyle tarif etmek","Geçmişten bir iyi metni örnek verip “bunun üslubunda yaz” demek","“Bizim gibi yaz” demek"],a:1,e:"Örnek göstermek (few-shot), tarif etmekten çok daha güçlüdür. Model üslubu ve yapıyı örnekten çıkarır."},
{q:"Yapay zeka sana bir araştırma raporu için kaynak listesi verdi. Ne yapmalısın?",o:["Akıcı yazıldığı için doğrudan kullanmak","Kaynakların gerçekten var olup olmadığını kendin doğrulamak","Aynı soruyu tekrar sorup aynı cevabı alırsan doğru kabul etmek"],a:1,e:"Model, var olmayan kaynak uydurabilir (halüsinasyon). Rakam, isim, kaynak, hukuki ve tıbbi bilgiyi mutlaka doğrula."},
{q:"Hangisini yapay zekaya yapıştırmak en risklidir?",o:["Yayımlanmış bir blog yazısı","Müşterilerin TC kimlik ve telefon bilgilerini içeren bir liste","Genel bir konu hakkında sorun"],a:1,e:"Kişisel veri ve şirket sırları paylaşılmamalı. Gerekirse isimleri “Müşteri A” gibi değiştir ve şirket politikasını öğren."},
{q:"İlk cevap fazla resmi geldi. En doğru hamle?",o:["Yapay zekanın kötü olduğuna karar verip bırakmak","Takip komutu vermek: “Daha sıcak ve kısa yap.”","Sıfırdan, çok daha uzun bir prompt yazmak"],a:1,e:"İlk cevap bir taslaktır. Prompting bir konuşmadır; birkaç tur ile sonuca varılır."},
{q:"Tek promptta şunları istedin: rapor yaz, çevir, sunuma dönüştür, e-posta taslağı hazırla. Sorun ne?",o:["Hiçbir sorun yok","Çok iş tek yerde: kalite düşer. Adım adım ayrı ayrı istemek daha iyi","Sadece çeviri kısmı yanlış olur"],a:1,e:"Bir promptta tek ana görev ilkesi. Çok iş varsa numaralandır veya parçalara böl."}
];
const S=[
{n:"Müşteri şikayeti yanıtı",t:"Online ayakkabı satıyorsun. Müşteri siparişinin 10 gündür gelmediğinden şikayetçi. Kargo firması gecikmeyi teyit etti. Müşteri daha önce 3 kez alışveriş yaptı. Yapay zekaya bir yanıt yazdıracaksın."},
{n:"Yöneticiye izin e-postası",t:"15–19 Aralık arasında yıllık izin istiyorsun. Dönem yoğun. İzinden önce iki projeyi bitireceksin ve Ayşe acil işlere bakacak. Yapay zekaya e-posta yazdıracaksın."},
{n:"Toplantı özeti",t:"1 saatlik proje toplantısının transkriptin var. Yapay zekadan karar, aksiyon ve açık soruları çıkarmasını isteyeceksin."}
];
const C=[
{k:"Rol",h:"Örnek: “Sen deneyimli bir müşteri iletişimi uzmanısın.”",f:t=>/\bsen\b.*(uzman|editör|danışman|yazar|sorumlu|analist|asistan)|olarak (çalış|davran|yaz)|rolün/.test(t)},
{k:"Bağlam",h:"Durumu, kişileri ve hedefi anlat. En az 25 kelime önerilir.",f:t=>t.split(/\s+/).filter(Boolean).length>=25},
{k:"Görev",h:"Net bir eylem fiili kullan: yaz, özetle, çıkar, karşılaştır.",f:t=>/(yaz|özetle|çıkar|karşılaştır|listele|hazırla|sınıflandır|öner|düzenle|çevir|oluştur)/.test(t)},
{k:"Format",h:"Tablo, madde, kelime sayısı, paragraf sayısı gibi.",f:t=>/(tablo|madde|kelime|paragraf|cümle|başlık|liste|format|sütun)/.test(t)},
{k:"Ton / hedef kitle",h:"Resmi mi samimi mi? Kim okuyacak?",f:t=>/(ton|resmi|samimi|sıcak|empatik|nazik|kibar|saygılı|profesyonel|okuyacak|hedef kitle)/.test(t)},
{k:"Kısıtlar",h:"Ne yapılmasın, sınır nedir? “en fazla”, “kullanma”, “ekleme”.",f:t=>/(en fazla|maksimum|geçme|aşma|kullanma|ekleme|yapma|sadece|yalnızca|geçmesin|olmasın)/.test(t)},
{k:"Örnek",h:"“Şuna benzer yaz” diyerek bir örnek ekle.",f:t=>/(örnek|şuna benzer|üslubunda|taklit)/.test(t)}
];
const $=s=>document.querySelector(s);
let i=0,score=0,done=false;
function render(){
  const p=$("#p1");
  if(i>=Q.length){
    const msg=score>=7?"Çok iyi. Temel mantığı oturtmuşsun.":score>=5?"İyi gidiyorsun. Yanlış yaptığın konulara tekrar bak.":"Başlangıç için gayet normal. Prompt doktorunda pratik yap.";
    p.innerHTML=`<div class="card"><p class="big">${score}/${Q.length}</p><p><b>${msg}</b></p><p><button class="btn" id="again">Testi yeniden çöz</button> <button class="btn alt" id="go">Prompt doktoruna geç</button></p></div>`;
    $("#again").onclick=()=>{i=0;score=0;render()};
    $("#go").onclick=()=>tab(2);return;
  }
  const q=Q[i];done=false;
  p.innerHTML=`<div class="card"><div class="meta"><span>Soru ${i+1} / ${Q.length}</span><span>Puan: ${score}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><p class="q">${q.q}</p><div id="opts"></div><div id="fb"></div></div>`;
  q.o.forEach((t,j)=>{const b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+j)+") "+t;b.onclick=()=>pick(j);$("#opts").appendChild(b)});
}
function pick(j){
  if(done)return;done=true;const q=Q[i];
  [...document.querySelectorAll(".opt")].forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("ok");else if(k===j)b.classList.add("no")});
  if(j===q.a)score++;
  $("#fb").innerHTML=`<div class="fb"><b>${j===q.a?"Doğru.":"Doğru cevap "+String.fromCharCode(65+q.a)+"."}</b> ${q.e}</div><button class="btn" id="nx">${i===Q.length-1?"Sonucu gör":"Sonraki soru"}</button>`;
  $("#nx").onclick=()=>{i++;render()};$("#nx").focus();
}
function tab(n){
  [1,2].forEach(k=>{$("#t"+k).setAttribute("aria-selected",k===n);$("#p"+k).hidden=k!==n});
}
$("#t1").onclick=()=>tab(1);$("#t2").onclick=()=>tab(2);
S.forEach((s,k)=>{const o=document.createElement("option");o.value=k;o.textContent=s.n;$("#sc").appendChild(o)});
function sc(){$("#scText").textContent=S[$("#sc").value].t;$("#res").innerHTML=""}
$("#sc").onchange=sc;sc();
$("#chk").onclick=()=>{
  const raw=$("#pr").value.trim();
  if(!raw){$("#res").innerHTML='<p class="fb">Önce bir prompt yaz, sonra kontrol et.</p>';return}
  const t=raw.toLocaleLowerCase("tr");
  const r=C.map(c=>({...c,ok:c.f(t)}));
  const n=r.filter(x=>x.ok).length;
  const msg=n>=6?"Çok güçlü bir prompt.":n>=4?"İyi bir taslak. Eksik yapı taşlarını ekle.":"Henüz zayıf. Eksikleri tamamla ve tekrar dene.";
  $("#res").innerHTML=`<p class="big">${n}/7</p><p><b>${msg}</b></p><ul class="chk">${r.map(x=>`<li class="${x.ok?"y":"n"}"><b>${x.ok?"✓":"✗"}</b><span>${x.k}${x.ok?"":`<small>${x.h}</small>`}</span></li>`).join("")}</ul>`;
};
render();
</script>
</body>
</html>
